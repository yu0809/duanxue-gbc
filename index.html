<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>断雪</title>
<!--SHELL-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Handheld shell. Layout: one device, centred; the screen scales by whole device pixels. */
:root {
  color-scheme: dark;
  --night: #12151f;
  --night-2: #1b2030;
  --body: #ecebe3;
  --body-shade: #d4d2c6;
  --body-edge: #b9b6a8;
  --bezel: #2b2d36;
  --bezel-2: #1d1f26;
  --ink: #1b1b22;
  --vermilion: #d23a2c;
  --vermilion-dark: #9c2219;
  --label: #8a8778;
  --hint: #8f97ad;
  --hint-strong: #d7dcea;
  --wind: #5aa06a; --thunder: #8a64c4; --water: #3b78c2; --fire: #d8452f; --earth: #c9a032;
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2) 0%, var(--night) 60%);
  color: var(--hint-strong);
  font-family: var(--serif);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding-inline: 16px;
  box-sizing: border-box;
}
.device {
  position: relative;
  width: var(--dev-w, 360px);
  height: calc(var(--dev-w, 360px) * 1.68);
  max-height: calc(100% - 40px);
  background: linear-gradient(160deg, var(--body) 0%, var(--body) 55%, var(--body-shade) 100%);
  border-radius: 14px 14px 64px 14px;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -4px 0 var(--body-edge),
    inset -3px 0 0 var(--body-shade),
    0 22px 50px rgba(0,0,0,.55);
  display: flex; flex-direction: column; align-items: center;
  box-sizing: border-box;
  padding: calc(var(--dev-w) * 0.06) calc(var(--dev-w) * 0.07) 0;
}
.bezel {
  width: 100%;
  background: var(--bezel);
  border-radius: 10px 10px 34px 10px;
  padding: calc(var(--dev-w) * 0.045) calc(var(--dev-w) * 0.05) calc(var(--dev-w) * 0.03);
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: inset 0 0 0 2px var(--bezel-2);
  position: relative;
}
.bezel .stripe {
  position: absolute; left: 12px; right: 12px; top: 7px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, var(--wind) 0 20%, var(--thunder) 20% 40%, var(--water) 40% 60%, var(--fire) 60% 80%, var(--earth) 80% 100%);
  opacity: .85;
}
.screen-wrap { position: relative; line-height: 0; }
#screen {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000;
  width: var(--scr-w, 320px); height: var(--scr-h, 288px);
  display: block;
  border-radius: 2px;
}
.lcd {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,0,0,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px);
  background-size: var(--px, 2px) var(--px, 2px);
  mix-blend-mode: multiply;
  opacity: var(--grid, 1);
}
.power { position: absolute; left: 10px; top: 40%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.power i { width: 7px; height: 7px; border-radius: 50%; background: #ff5240; box-shadow: 0 0 6px #ff5240; display: block; }
.power span { font: 600 7px/1 var(--serif); color: #8d909c; letter-spacing: .1em; writing-mode: vertical-rl; }
.brand {
  margin-top: calc(var(--dev-w) * 0.03);
  display: flex; align-items: baseline; gap: 10px;
  color: var(--ink);
}
.brand b { font: 400 calc(var(--dev-w) * 0.085)/1 var(--brush); letter-spacing: .02em; }
.brand small { font: 700 calc(var(--dev-w) * 0.026)/1 var(--serif); letter-spacing: .32em; color: var(--label); }
.controls {
  position: relative; width: 100%; flex: 1;
}
.dpad {
  position: absolute; left: 2%; top: 14%;
  width: calc(var(--dev-w) * 0.30); height: calc(var(--dev-w) * 0.30);
}
.dpad .arm { position: absolute; background: var(--ink); border-radius: 3px; box-shadow: 0 3px 0 #000, inset 0 1px 0 #3a3c46; }
.dpad .h { left: 0; right: 0; top: 33.3%; height: 33.3%; }
.dpad .v { top: 0; bottom: 0; left: 33.3%; width: 33.3%; }
.dpad .hub { position: absolute; left: 41%; top: 41%; width: 18%; height: 18%; border-radius: 50%; background: radial-gradient(circle, #2c2e38 0 40%, var(--ink) 41%); }
.dpad.up .v { box-shadow: 0 3px 0 #000, inset 0 6px 0 #000; }
.ab { position: absolute; right: 1%; top: 10%; width: calc(var(--dev-w) * 0.40); height: calc(var(--dev-w) * 0.26); transform: rotate(-24deg); }
.btn {
  position: absolute; width: calc(var(--dev-w) * 0.15); height: calc(var(--dev-w) * 0.15);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f06a58 0%, var(--vermilion) 45%, var(--vermilion-dark) 100%);
  box-shadow: 0 4px 0 #6d140e, 0 6px 10px rgba(0,0,0,.3);
  display: grid; place-items: center;
}
.btn.down, .pill.down { transform: translateY(3px); box-shadow: 0 1px 0 #6d140e; }
.btn.a { right: 0; top: 0; }
.btn.b { left: 0; top: 30%; }
.btn em { position: absolute; bottom: -1.5em; font: 700 calc(var(--dev-w) * 0.032)/1 var(--serif); color: var(--label); font-style: normal; transform: rotate(24deg); }
.pills { position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%); display: flex; gap: calc(var(--dev-w) * 0.07); }
.pill-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: rotate(-24deg); }
.pill { width: calc(var(--dev-w) * 0.12); height: calc(var(--dev-w) * 0.034); border-radius: 99px; background: #8b8a82; box-shadow: 0 2px 0 #5d5c55; }
.pill-wrap span { font: 700 calc(var(--dev-w) * 0.026)/1 var(--serif); color: var(--label); letter-spacing: .12em; }
.grille { position: absolute; right: 7%; bottom: 7%; display: flex; gap: 6px; transform: rotate(-28deg); }
.grille i { width: 5px; height: calc(var(--dev-w) * 0.13); border-radius: 3px; background: var(--body-edge); box-shadow: inset 0 2px 2px rgba(0,0,0,.25); display: block; }
.hint {
  color: var(--hint); font: 500 12px/1.6 var(--serif); text-align: center; letter-spacing: .04em;
  display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 520px;
}
.hint kbd { font: 600 11px/1 ui-monospace, Menlo, monospace; color: var(--hint-strong); background: #272c3c; border: 1px solid #39405a; border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; }
.hint button { font: inherit; color: var(--hint-strong); background: none; border: 1px solid #39405a; border-radius: 99px; padding: 2px 10px; cursor: pointer; }
.hint button:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 2px; }
@media (pointer: coarse) { .hint .keys { display: none; } }
/* 掌机模式: the bare screen, centred on black */
.solo { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10; }
.solo #screen { width: var(--solo-w); height: var(--solo-h); border-radius: 0; }
.solo .lcd { position: absolute; left: 50%; top: 50%; width: var(--solo-w); height: var(--solo-h); transform: translate(-50%, -50%); inset: auto; background-size: calc(var(--solo-w) / 160) calc(var(--solo-h) / 144); }
.solo-tip { position: absolute; bottom: max(10px, env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: var(--hint); font: 500 12px/1.4 var(--serif); letter-spacing: .06em; transition: opacity .8s; pointer-events: none; }
.solo.tip-gone .solo-tip { opacity: 0; }
body.solo-mode .stage { visibility: hidden; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .btn, .pill { transition: none; } }
</style>
<!--SHELL-END-->
</head>
<body>
<!--BODY-START-->
<div class="stage">
  <div class="device" id="device">
    <div class="bezel">
      <div class="stripe"></div>
      <div class="power"><i></i><span>灵力</span></div>
      <div class="screen-wrap"><canvas id="screen" width="160" height="144" aria-label="游戏画面"></canvas><div class="lcd"></div></div>
      <div class="brand"><b>断雪</b><small>掌中剑</small></div>
    </div>
    <div class="controls">
      <div class="dpad" id="dpad"><div class="arm h"></div><div class="arm v"></div><div class="hub"></div></div>
      <div class="ab"><div class="btn b" data-btn="b"><em>B</em></div><div class="btn a" data-btn="a"><em>A</em></div></div>
      <div class="pills">
        <div class="pill-wrap"><div class="pill" data-btn="select"></div><span>SELECT</span></div>
        <div class="pill-wrap"><div class="pill" data-btn="start"></div><span>START</span></div>
      </div>
      <div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="hint">
    <span class="keys"><kbd>↑↓←→</kbd> 移动</span>
    <span class="keys"><kbd>Z</kbd> 确认</span>
    <span class="keys"><kbd>X</kbd> 取消 / 按住奔跑</span>
    <span class="keys"><kbd>Enter</kbd> 菜单</span>
    <span class="keys">先点一下画面</span>
    <button id="modeToggle" type="button">掌机模式</button>
    <button id="mute" type="button">声音：开</button>
  </div>
</div>
<!--BODY-END-->
