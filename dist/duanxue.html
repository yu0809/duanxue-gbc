<title>断雪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Handheld shell. Layout: one device, centred; the screen scales by whole device pixels. */
:root {
  color-scheme: dark;
  --night: #12151f;
  --night-2: #1b2030;
  --body: #ecebe3;
  --body-shade: #d4d2c6;
  --body-edge: #b9b6a8;
  --bezel: #2b2d36;
  --bezel-2: #1d1f26;
  --ink: #1b1b22;
  --vermilion: #d23a2c;
  --vermilion-dark: #9c2219;
  --label: #8a8778;
  --hint: #8f97ad;
  --hint-strong: #d7dcea;
  --wind: #5aa06a; --thunder: #8a64c4; --water: #3b78c2; --fire: #d8452f; --earth: #c9a032;
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2) 0%, var(--night) 60%);
  color: var(--hint-strong);
  font-family: var(--serif);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding-inline: 16px;
  box-sizing: border-box;
}
.device {
  position: relative;
  width: var(--dev-w, 360px);
  height: calc(var(--dev-w, 360px) * 1.68);
  max-height: calc(100% - 40px);
  background: linear-gradient(160deg, var(--body) 0%, var(--body) 55%, var(--body-shade) 100%);
  border-radius: 14px 14px 64px 14px;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -4px 0 var(--body-edge),
    inset -3px 0 0 var(--body-shade),
    0 22px 50px rgba(0,0,0,.55);
  display: flex; flex-direction: column; align-items: center;
  box-sizing: border-box;
  padding: calc(var(--dev-w) * 0.06) calc(var(--dev-w) * 0.07) 0;
}
.bezel {
  width: 100%;
  background: var(--bezel);
  border-radius: 10px 10px 34px 10px;
  padding: calc(var(--dev-w) * 0.045) calc(var(--dev-w) * 0.05) calc(var(--dev-w) * 0.03);
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: inset 0 0 0 2px var(--bezel-2);
  position: relative;
}
.bezel .stripe {
  position: absolute; left: 12px; right: 12px; top: 7px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, var(--wind) 0 20%, var(--thunder) 20% 40%, var(--water) 40% 60%, var(--fire) 60% 80%, var(--earth) 80% 100%);
  opacity: .85;
}
.screen-wrap { position: relative; line-height: 0; }
#screen {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000;
  width: var(--scr-w, 320px); height: var(--scr-h, 288px);
  display: block;
  border-radius: 2px;
}
.lcd {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,0,0,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px);
  background-size: var(--px, 2px) var(--px, 2px);
  mix-blend-mode: multiply;
  opacity: var(--grid, 1);
}
.power { position: absolute; left: 10px; top: 40%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.power i { width: 7px; height: 7px; border-radius: 50%; background: #ff5240; box-shadow: 0 0 6px #ff5240; display: block; }
.power span { font: 600 7px/1 var(--serif); color: #8d909c; letter-spacing: .1em; writing-mode: vertical-rl; }
.brand {
  margin-top: calc(var(--dev-w) * 0.03);
  display: flex; align-items: baseline; gap: 10px;
  color: var(--ink);
}
.brand b { font: 400 calc(var(--dev-w) * 0.085)/1 var(--brush); letter-spacing: .02em; }
.brand small { font: 700 calc(var(--dev-w) * 0.026)/1 var(--serif); letter-spacing: .32em; color: var(--label); }
.controls {
  position: relative; width: 100%; flex: 1;
}
.dpad {
  position: absolute; left: 2%; top: 14%;
  width: calc(var(--dev-w) * 0.30); height: calc(var(--dev-w) * 0.30);
}
.dpad .arm { position: absolute; background: var(--ink); border-radius: 3px; box-shadow: 0 3px 0 #000, inset 0 1px 0 #3a3c46; }
.dpad .h { left: 0; right: 0; top: 33.3%; height: 33.3%; }
.dpad .v { top: 0; bottom: 0; left: 33.3%; width: 33.3%; }
.dpad .hub { position: absolute; left: 41%; top: 41%; width: 18%; height: 18%; border-radius: 50%; background: radial-gradient(circle, #2c2e38 0 40%, var(--ink) 41%); }
.dpad.up .v { box-shadow: 0 3px 0 #000, inset 0 6px 0 #000; }
.ab { position: absolute; right: 1%; top: 10%; width: calc(var(--dev-w) * 0.40); height: calc(var(--dev-w) * 0.26); transform: rotate(-24deg); }
.btn {
  position: absolute; width: calc(var(--dev-w) * 0.15); height: calc(var(--dev-w) * 0.15);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f06a58 0%, var(--vermilion) 45%, var(--vermilion-dark) 100%);
  box-shadow: 0 4px 0 #6d140e, 0 6px 10px rgba(0,0,0,.3);
  display: grid; place-items: center;
}
.btn.down, .pill.down { transform: translateY(3px); box-shadow: 0 1px 0 #6d140e; }
.btn.a { right: 0; top: 0; }
.btn.b { left: 0; top: 30%; }
.btn em { position: absolute; bottom: -1.5em; font: 700 calc(var(--dev-w) * 0.032)/1 var(--serif); color: var(--label); font-style: normal; transform: rotate(24deg); }
.pills { position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%); display: flex; gap: calc(var(--dev-w) * 0.07); }
.pill-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: rotate(-24deg); }
.pill { width: calc(var(--dev-w) * 0.12); height: calc(var(--dev-w) * 0.034); border-radius: 99px; background: #8b8a82; box-shadow: 0 2px 0 #5d5c55; }
.pill-wrap span { font: 700 calc(var(--dev-w) * 0.026)/1 var(--serif); color: var(--label); letter-spacing: .12em; }
.grille { position: absolute; right: 7%; bottom: 7%; display: flex; gap: 6px; transform: rotate(-28deg); }
.grille i { width: 5px; height: calc(var(--dev-w) * 0.13); border-radius: 3px; background: var(--body-edge); box-shadow: inset 0 2px 2px rgba(0,0,0,.25); display: block; }
.hint {
  color: var(--hint); font: 500 12px/1.6 var(--serif); text-align: center; letter-spacing: .04em;
  display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 520px;
}
.hint kbd { font: 600 11px/1 ui-monospace, Menlo, monospace; color: var(--hint-strong); background: #272c3c; border: 1px solid #39405a; border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; }
.hint button { font: inherit; color: var(--hint-strong); background: none; border: 1px solid #39405a; border-radius: 99px; padding: 2px 10px; cursor: pointer; }
.hint button:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 2px; }
@media (pointer: coarse) { .hint .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .btn, .pill { transition: none; } }
</style>
<div class="stage">
  <div class="device" id="device">
    <div class="bezel">
      <div class="stripe"></div>
      <div class="power"><i></i><span>灵力</span></div>
      <div class="screen-wrap"><canvas id="screen" width="160" height="144" aria-label="游戏画面"></canvas><div class="lcd"></div></div>
      <div class="brand"><b>断雪</b><small>掌中剑</small></div>
    </div>
    <div class="controls">
      <div class="dpad" id="dpad"><div class="arm h"></div><div class="arm v"></div><div class="hub"></div></div>
      <div class="ab"><div class="btn b" data-btn="b"><em>B</em></div><div class="btn a" data-btn="a"><em>A</em></div></div>

        <div class="pill-wrap"><div class="pill" data-btn="select"></div><span>SELECT</span></div>
        <div class="pill-wrap"><div class="pill" data-btn="start"></div><span>START</span></div>
      </div>
      <div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="hint">
    <span class="keys"><kbd>↑↓←→</kbd> 移动</span>
    <span class="keys"><kbd>Z</kbd> 确认</span>

    <span class="keys">先点一下画面</span>
    <button id="mute" type="button">声音：开</button>
  </div>
</div>

'use strict';
// ============================================================
//  断雪 · core — screen, loop, input, timing, post effects
// ============================================================
const SW = 160, SH = 144;

const screenCanvas = document.getElementById('screen');
const sctx = screenCanvas.getContext('2d', { alpha: false });
sctx.imageSmoothingEnabled = false;

// The game draws into a back buffer; post effects run when we copy it out.
const buf = document.createElement('canvas');
buf.width = SW; buf.height = SH;
const ctx = buf.getContext('2d', { willReadFrequently: true });
ctx.imageSmoothingEnabled = false;

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return c;
}

// ---------- small utils ----------

// SPR[name] = { down:[a,b,c,d], up:[...], left:[...], right:[...] } walk cycles of 4
const SPR = {};
function buildCharSprites() {
  for (const name in CHAR_PAL) {
    const { tpl, map } = CHAR_PAL[name];
    const T = CHAR_TPL[tpl];
    const mk = (rows) => art(recolor(rows, map));
    if (T.mon) {
      const a = mk(T.down[0]), b = mk(T.down[1]);
      const cyc = [a, b, a, b];
      SPR[name] = { down: cyc, up: cyc, left: cyc, right: cyc, mon: true };
      continue;
    }
    const d0 = mk(T.down[0]), d1 = mk(T.down[1]);
    const u0 = mk(T.up[0]), u1 = mk(T.up[1]);
    const l0 = mk(T.left[0]), l1 = mk(T.left[1]);
    SPR[name] = {
      down: [d0, d1, d0, flipH(d1)],
      up: [u0, u1, u0, flipH(u1)],
      left: [l0, l1, l0, l1],
      right: [flipH(l0), flipH(l1), flipH(l0), flipH(l1)],
    };
  }
}

'use strict';
// ============================================================
//  Tiles & map props (16x16 metatiles, GBC 4-colour cells)
//  Ground tiles are opaque; object tiles may use '.' (clear).
// ============================================================
const TILES = {};     // name -> { rows | frames, solid, over, ... }
const TILE_IMG = {};  // name -> canvas (first frame) — for gallery
const TILE_FR = {};   // name -> [canvas, ...] animation frames
function tile(name, rows, opt = {}) { TILES[name] = Object.assign({ rows }, opt); }
// cut a big drawing into named 16x16 tiles: name_x_y
function bigTile(name, rows, opt = {}) {
  const h = rows.length / 16, w = rows[0].length / 16;
  const meta = { w, h, parts: [] };
  for (let ty = 0; ty < h; ty++) for (let tx = 0; tx < w; tx++) {
    const part = [];
    for (let y = 0; y < 16; y++) part.push(rows[ty * 16 + y].slice(tx * 16, tx * 16 + 16));
    const o = typeof opt === 'function' ? opt(tx, ty, w, h) : opt;
    tile(`${name}_${tx}_${ty}`, part, o);
    meta.parts.push(`${name}_${tx}_${ty}`);
  }
  BIG[name] = meta;
}

// Built per side as transparent overlays; mask bits 1=N 2=E 4=S 8=W
const EDGE_SETS = {
  snow: { lip: 'x', hi: 'W', sh: 'g' },
  grass: { lip: 'l', hi: 'L', sh: 'E' },
  moss: { lip: 'G', hi: 'v', sh: 'h' },
};
function edgeSide(side, set) {
  const g = Array.from({ length: 16 }, () => Array(16).fill('.'));
  const rnd = mulberry(side * 97 + 13);
  for (let i = 0; i < 16; i++) {
    const depth = 2 + (rnd() < 0.45 ? 1 : 0) + (rnd() < 0.15 ? 1 : 0);
    for (let d = 0; d < depth; d++) {
      const c = d === 0 && rnd() < 0.3 ? set.hi : set.lip;
      put(i, d, c);
    }
    if (rnd() < 0.7) put(i, depth, set.sh);
  }
  function put(i, d, c) {
    if (side === 0) g[d][i] = c;            // north: rows from top
    else if (side === 2) g[15 - d][i] = d === 0 ? c : (c === set.sh ? set.sh : c); // south
    else if (side === 3) g[i][d] = c;       // west
    else g[i][15 - d] = c;                  // east
  }
  // south edge reads as the near bank: no shadow, just the lip
  if (side === 2) for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (g[y][x] === set.sh) g[y][x] = '.';
  return art(g.map((r) => r.join('')));
}
const EDGE_IMG = {};
function edgeImgs(setName) {
  if (!EDGE_IMG[setName]) EDGE_IMG[setName] = [0, 1, 2, 3].map((s) => edgeSide(s, EDGE_SETS[setName]));
  return EDGE_IMG[setName];
}

// ---------------- autotiling for water ----------------
// mask bits: 1=N land, 2=E land, 4=S land, 8=W land
function waterVariant(rows, mask, landLip = 'x', lipShade = 'w', dark = 'D') {
  const g = rows.map((r) => r.split(''));
  if (mask & 1) { for (let x = 0; x < 16; x++) { g[0][x] = landLip; g[1][x] = lipShade; g[2][x] = dark; } }
  if (mask & 4) { for (let x = 0; x < 16; x++) { g[15][x] = dark; } }
  if (mask & 8) { for (let y = 0; y < 16; y++) { g[y][0] = landLip; g[y][1] = lipShade; if (g[y][2] !== landLip && g[y][2] !== lipShade) g[y][2] = dark; } }
  if (mask & 2) { for (let y = 0; y < 16; y++) { g[y][15] = landLip; g[y][14] = lipShade; if (g[y][13] !== landLip && g[y][13] !== lipShade) g[y][13] = dark; } }
  return g.map((r) => r.join(''));
}
function shiftRows(rows, dx) {
  return rows.map((r, y) => {
    const s = (dx * (y % 4 < 2 ? 1 : -1) + 16) % 16;
    return r.slice(16 - s) + r.slice(0, 16 - s);
  });
}

// Build every tile image (with animation frames)
function buildTiles() {
  for (const name in TILES) {
    const t = TILES[name];
    let frames;
    if (t.frames) frames = t.frames;
    else if (t.anim === 'shift') frames = [t.rows, shiftRows(t.rows, 2)];
    else frames = [t.rows];
    TILE_FR[name] = frames.map((r) => art(r));
    TILE_IMG[name] = TILE_FR[name][0];
  }
}
// Lazily build autotile variants of water-like tiles
const AUTO_CACHE = {};
function autoTile(base, mask) {
  const key = base + mask;
  if (AUTO_CACHE[key]) return AUTO_CACHE[key];
  const t = TILES[base];
  const lip = t.lip || ['x', 'w', 'D'];
  const f0 = waterVariant(t.rows, mask, ...lip);
  const frames = t.anim === 'shift' ? [f0, waterVariant(shiftRows(t.rows, 2), mask, ...lip)] : [f0];
  return (AUTO_CACHE[key] = frames.map((r) => art(r)));
}

// speckled texture: base colour plus scattered specks / tufts
function noiseRows(base, specks, seed, tuft) {
  const r = mulberry(seed);
  const g = Array.from({ length: 16 }, () => Array(16).fill(base));
  for (const [col, n] of specks) for (let i = 0; i < n; i++) {
    const x = Math.floor(r() * 16), y = Math.floor(r() * 16);
    g[y][x] = col;
    if (tuft && col === tuft && y > 0 && x > 0 && x < 15) { g[y - 1][x] = col; g[y][x - 1] = col; g[y][x + 1] = col; }
  }
  return g.map((row) => row.join(''));
}

  // a carved cloud roundel spanning 2x2 slabs, drawn procedurally
  const rows = [];
  for (let y = 0; y < 32; y++) {
    let r = '';
    for (let x = 0; x < 32; x++) {
      const dx = x - 15.5, dy = y - 15.5, d = Math.sqrt(dx * dx + dy * dy);
      let c = (x % 16 === 15 || y % 16 === 15) ? 'g' : (x % 16 === 0 || y % 16 === 0) ? 'x' : 'w';
      if (d < 14.5 && d > 12.5) c = 'n';
      else if (d <= 12.5) {
        c = 'g';
        const a = Math.atan2(dy, dx);
        // taiji-like swirl: two interlocking halves
        const s = Math.sin(a * 1 + d * 0.32);
        if (s > 0.35) c = 'w';
        if (d < 2.2) c = 'n';
        if (Math.abs(d - 7) < 0.7 && s <= 0.35) c = 'n';
      }
      r += c;
    }
    rows.push(r);
  }
  return rows;
})(), { flat: true });

function elemMult(atk, def) {
  if (!atk || !def) return 1;
  if (BEATS[atk] === def) return 1.5;
  if (BEATS[def] === atk) return 0.7;
  if (atk === def) return 0.5;
  return 1;
}

const EXP_TABLE = [0];
for (let L = 1; L <= 40; L++) EXP_TABLE[L] = Math.round(10 * Math.pow(L - 1, 2.15) + 10 * (L - 1));
// sword 断雪: ATK by forge stage
const SWORD_ATK = [4, 10, 18, 27, 37, 48];
const SWORD_NAMES = ['断雪（残）', '断雪·一淬', '断雪·二淬', '断雪·三淬', '断雪·四淬', '断雪'];
const LING_ORDER = ['fire', 'wind', 'water', 'thunder', 'earth'];
const LING_NAME = { fire: '火之灵', wind: '风之灵', water: '水之灵', thunder: '雷之灵', earth: '土之灵' };

function newChar(id, lv = 1) {
  const c = { id, lv, exp: EXP_TABLE[lv], equip: Object.assign({}, CHARS[id].equip), status: {} };
  const s = calcBase(id, lv);
  c.hp = s.hp; c.mp = s.mp;
  return c;
}
function calcBase(id, lv) {
  const C = CHARS[id];
  const o = {};
  for (const k in C.base) o[k] = Math.round(C.base[k] + C.grow[k] * (lv - 1));
  return o;
}
function stats(c) {
  const o = calcBase(c.id, c.lv);
  for (const slot of ['weapon', 'armor', 'acc']) {
    const e = c.equip[slot] && ITEMS[c.equip[slot]];
    if (!e || !e.bonus) continue;
    for (const k in e.bonus) o[k] = (o[k] || 0) + e.bonus[k];
  }
  if (c.id === 'shenmo') o.atk += SWORD_ATK[State.sword] || 4;
  o.mhp = o.hp; o.mmp = o.mp;
  return o;
}
function charSkills(c) {
  const list = [];
  for (const s of CHARS[c.id].skills) {
    if (s.lv && c.lv < s.lv) continue;
    if (s.sword && !State.flags['ling_' + s.sword]) continue;
    if (s.flag && !State.flags[s.flag]) continue;
    list.push(s.id);
  }
  return list;
}
function initParty() {
  State.chars = { shenmo: newChar('shenmo', 1) };
  State.party = ['shenmo'];
  State.items = { herb: 3 };
}
function joinParty(id, lv) {
  if (State.party.includes(id)) return;
  if (!State.chars[id]) {
    const avg = Math.round(State.party.reduce((s, p) => s + State.chars[p].lv, 0) / State.party.length);
    State.chars[id] = newChar(id, lv || avg);
  }
  State.party.push(id);
  if (Game.scene === Field) { Field.makeFollowers(); Field.resetFollowers(); }
}

function pickEncounter(enc) {
  const g = GROUPS[enc.group];
  if (!g) return null;
  return { enemies: pick(g), bg: enc.bg, music: enc.music };
}

const PORTRAIT = {};
function overlay(base, layer) {
  if (!layer) return base;
  return base.map((row, y) => {
    const l = layer[y] || '';
    let out = '';
    for (let x = 0; x < 32; x++) { const c = l[x]; out += c && c !== '.' ? c : row[x]; }
    return out;
  });
}
// expressions: '' (default) and 'smile' (happy closed eyes, soft smile)
const PORT_EXPR = { suli: ['smile'], shenmo: ['smile'], laotie: ['smile'] };
function buildPortraits() {
  for (const [name, P] of Object.entries(PORT_SRC)) {
    for (const expr of [''].concat(PORT_EXPR[name] || [])) {
      let g = Array.from({ length: 32 }, () => '.'.repeat(32));
      g = overlay(g, P.back);
      let face = FACE.map((r) => r.replace(/e/g, P.eye));
      const setAt = (row, x, str) => row.slice(0, x) + Array.from(str).map((c, i) => (c === '.' ? row[x + i] : c)).join('') + row.slice(x + str.length);
      if (P.narrowEyes) { face[18] = setAt(face[18], 8, 'KKKK'); face[18] = setAt(face[18], 19, 'KKKKK'); face[17] = setAt(face[17], 8, 'KKKK'); face[17] = setAt(face[17], 19, 'KKKK'); }
      if (P.closedEyes || expr === 'smile') {
        for (let y = 17; y <= 20; y++) { face[y] = setAt(face[y], 8, 'ssss'); face[y] = setAt(face[y], 19, 'sssss'); }
      }
      if (P.closedEyes) {
        face[19] = setAt(face[19], 8, 'KKKK'); face[19] = setAt(face[19], 19, 'KKKK');
        face[20] = setAt(face[20], 8, 'K'); face[20] = setAt(face[20], 22, 'K');
      } else if (expr === 'smile') {
        // upturned arcs: ^  ^
        face[18] = setAt(face[18], 9, 'KK'); face[18] = setAt(face[18], 20, 'KK');
        face[19] = setAt(face[19], 8, 'K..K'); face[19] = setAt(face[19], 19, 'K..K');
      }
      face = face.map((r, y) => (y === 23 ? r.slice(0, 14) + 'sss' + r.slice(17) : r));
      const mouth = expr === 'smile' ? [[13, 22, 'K...K'], [14, 23, 'KKK']] : P.mouth || [];
      for (const [x, y, str] of mouth) face[y] = setAt(face[y], x, str);
      if (expr === 'smile') { face[21] = setAt(face[21], 7, 'M'); face[21] = setAt(face[21], 22, 'M'); }
      g = overlay(g, face);
      g = overlay(g, P.clothes);
      g = overlay(g, P.hair);
      g = overlay(g, P.extra);
      const key = expr ? name + '_' + expr : name;
      PORTRAIT[key] = art(g);
      if (!expr) PORT_SRC[name].rows = g;
    }
  }
}

function extraGallery(items, only) {
  if (only && only !== 'portraits') return;
  if (!PORTRAIT.shenmo) buildPortraits();
  for (const n in PORTRAIT) items.push(['face ' + n, [PORTRAIT[n]]]);
}

function brushRows(key) {
  const rows = BRUSH[key].split('|');
  const w = Math.max(...rows.map((r) => r.length));
  return rows.map((r) => r.padEnd(w, '.'));
}
// render a brush glyph: fill colour, optional 1px outline and drop shadow
const brushCache = {};
function brushImg(key, fill = 'W', outline = 'K', shadow = null) {
  const id = key + fill + outline + shadow;
  if (brushCache[id]) return brushCache[id];
  const rows = brushRows(key);
  const w = rows[0].length + 3, h = rows.length + 3;
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  const on = (x, y) => y >= 0 && y < rows.length && x >= 0 && x < rows[0].length && rows[y][x] === '#';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const sx = x - 1, sy = y - 1;
    if (on(sx, sy)) g[y][x] = fill;
    else if (outline && (on(sx - 1, sy) || on(sx + 1, sy) || on(sx, sy - 1) || on(sx, sy + 1))) g[y][x] = outline;
    else if (shadow && (on(sx - 2, sy - 2) || on(sx - 1, sy - 2) || on(sx - 2, sy - 1))) g[y][x] = shadow;
  }
  return (brushCache[id] = art(g.map((r) => r.join(''))));
}

// Rich text: {red text}  [blue text]  — markup chars are not shown
function parseRich(text) {
  const out = [];
  let col = null;
  for (const ch of text) {
    if (ch === '{') { col = PAL.r; continue; }
    if (ch === '[') { col = PAL.B; continue; }
    if (ch === '}' || ch === ']') { col = null; continue; }
    out.push({ ch, col });
  }
  return out;
}
function wrapRich(cells, maxW) {
  const plain = cells.map((c) => c.ch).join('');
  const lines = Font.wrap(plain, maxW);
  // map back to cells (wrap only drops nothing, so walk in order)
  const res = []; let i = 0;
  for (const ln of lines) {
    const row = [];
    for (const ch of ln) {
      while (i < cells.length && cells[i].ch !== ch) i++; // skip newlines
      if (i < cells.length) { row.push(cells[i]); i++; }
    }
    res.push(row);
  }
  return res;
}

      if (--b.status.sleep <= 0) { delete b.status.sleep; await this.say(`${b.name} 醒了过来。`); }
      else { await this.say(`${b.name} 正在沉睡……`); b.ct = 0; this.decayBuffs(b); return; }
    }
    if (b.status.stun) { delete b.status.stun; await this.say(`${b.name} 头晕目眩，动弹不得！`); b.ct = 0; this.decayBuffs(b); return; }
    let act;
    if (b.side === 'ally') {
      b.step = 1;
      act = this.auto ? autoAction(b, this) : await this.playerCommand(b);
      if (act && act.type === 'auto') { this.auto = true; act = autoAction(b, this); }
    } else act = enemyAction(b, this);
    if (act) await this.execute(b, act);
    b.step = 0;
    if (b.status.seal) { b.status.seal--; if (b.status.seal <= 0) delete b.status.seal; }
    this.decayBuffs(b);
    b.ct = act && act.type === 'defend' ? 30 : act && act.quick ? 25 : 0;
    this.current = null;
  },
  decayBuffs(b) {
    for (const k in b.buff) if (--b.buff[k] <= 0) delete b.buff[k];
    for (const k in b.debuff) if (--b.debuff[k] <= 0) delete b.debuff[k];
  },
  // ---------- player command ----------
  async playerCommand(b) {
    for (;;) {
      const cmd = await this.openMenu(new CmdMenu(b));
      if (cmd === 'attack') {
        const t = await this.pickTarget('enemy', b);
        if (t) return { type: 'attack', target: t };
      } else if (cmd === 'skill') {
        const sk = await this.openMenu(new SkillMenu(b));
        if (!sk) continue;
        const S = SKILLS[sk];
        const t = await this.pickTarget(S.target, b, S);
        if (t) return { type: 'skill', skill: sk, target: t };
      } else if (cmd === 'item') {
        const it = await this.openMenu(new ItemMenu(b));
        if (!it) continue;
        const t = await this.pickTarget(ITEMS[it].target, b);
        if (t) return { type: 'item', item: it, target: t };
      } else if (cmd === 'defend') return { type: 'defend' };
      else if (cmd === 'flee') return { type: 'flee' };
      else if (cmd === 'auto') return { type: 'auto' };
    }
  },
  openMenu(m) {
    return new Promise((res) => { m.done = (v) => { this.menu = null; this.desc = null; res(v); }; this.menu = m; });
  },
  pickTarget(kind, user, skill) {
    if (kind === 'self' || kind === 'none') return Promise.resolve(user);
    if (kind === 'enemies') return this.openMenu(new TargetPicker(this.enemies.filter((e) => !e.dead), true, user, skill)).then((r) => (r ? this.enemies.filter((e) => !e.dead) : null));
    if (kind === 'allies') return this.openMenu(new TargetPicker(this.allies.filter((a) => !a.dead), true, user, skill)).then((r) => (r ? this.allies.filter((a) => !a.dead) : null));
    if (kind === 'enemy') return this.openMenu(new TargetPicker(this.enemies.filter((e) => !e.dead), false, user, skill));
    if (kind === 'ally') return this.openMenu(new TargetPicker(this.allies.filter((a) => !a.dead), false, user, skill));
    if (kind === 'dead') {
      const dead = this.allies.filter((a) => a.dead);
      if (!dead.length) { Sound.sfx('bump'); return Promise.resolve(null); }
      return this.openMenu(new TargetPicker(dead, false, user, skill));
    }
    return Promise.resolve(null);
  },
  // ---------- execution ----------
  async execute(b, act) {
    if (act.type === 'defend') { b.defending = true; Sound.sfx('guard'); await this.say(`${b.name} 摆出防御架势。`, 24); return; }
    if (act.type === 'flee') return this.tryFlee(b);
    if (act.type === 'charge') { b.charge = act.skill; await this.say(act.text || `${b.name} 正在蓄力……`, 40); return; }
    if (act.type === 'talk') { await this.say(act.text, 50); return; }
    if (act.type === 'attack') {
      const t = retarget(act.target, b, this);
      if (!t) return;
      await this.say(`${b.name} 的攻击！`, 1);
      await this.lunge(b);
      await this.hitPhys(b, t, 1, null, b.side === 'ally' ? 'slash' : 'claw');
      await this.unlunge(b);
      return;
    }
    if (act.type === 'item') return this.useItem(b, act.item, act.target);
    if (act.type === 'skill') return this.useSkill(b, act.skill, act.target);
  },
  async useSkill(b, id, target) {
    const S = SKILLS[id];
    if (b.side === 'ally') {
      if (S.mp && b.mp < S.mp) { await this.say('真气不足！'); return; }
      if (S.gold && State.gold < S.gold) { await this.say('钱不够……'); return; }
      if (b.status.seal) { await this.say(`${b.name} 被封咒，施展不了！`); return; }
      b.mp -= S.mp || 0;
      if (S.gold) State.gold -= S.gold;
    }
    let targets = Array.isArray(target) ? target : [target];
    if (S.target === 'enemies') targets = (b.side === 'ally' ? this.enemies : this.allies).filter((x) => !x.dead);
    else if (S.target === 'allies') targets = (b.side === 'ally' ? this.allies : this.enemies).filter((x) => !x.dead);
    else if (S.target === 'self') targets = [b];
    else if (S.target === 'enemy') { const t = retarget(targets[0], b, this); targets = t ? [t] : []; }
    if (!targets.length) return;
    this.msg = S.name; this.msgT = 999; this.msgBig = true;
    Sound.sfx('magic');
    if (b.side === 'ally') b.pose = S.kind === 'phys' || S.kind === 'steal' || S.kind === 'coins' ? 'attack' : 'cast';
    else b.flashT = 10;
    await wait(16);
    const fxName = S.fx || (S.kind === 'phys' ? 'slash' : 'magic');
    if (S.kind === 'phys') {
      if (b.side === 'ally') await this.lunge(b);
      const hits = S.hits || 1;
      for (let h = 0; h < hits; h++) {
        await playFx(this, fxName, targets, b);
        for (const t of targets) if (!t.dead) await this.hitPhys(b, t, S.power, S.el, null, S, true);
        await wait(8);
      }
      if (S.recoil) { await wait(10); this.damage(b, Math.round(b.mhp * S.recoil), { color: 'hurt' }); await wait(20); }
      if (b.side === 'ally') await this.unlunge(b);
    } else if (S.kind === 'mag') {
      await playFx(this, fxName, targets, b);
      for (const t of targets) if (!t.dead) this.hitMag(b, t, S.power, S.el, S);
      await wait(36);
      for (const t of targets) if (t.dead && !t.gone) await this.killAnim(t);
    } else if (S.kind === 'heal') {
      await playFx(this, 'heal', targets, b);
      for (const t of targets) {
        const amt = S.scale ? Math.round((S.power + eff(b, 'mag') * S.scale) * rnd(0.95, 1.05)) : Math.round(t.mhp * S.power);
        this.heal(t, amt);
      }
      await wait(30);
    } else if (S.kind === 'buff') {
      await playFx(this, 'buff', targets, b);
      for (const t of targets) { t.buff[S.buff] = 4; this.pop(t, BUFF_NAME[S.buff] + '↑', 'buff'); }
      Sound.sfx('buff');
      await wait(30);
    } else if (S.kind === 'debuff') {
      await playFx(this, fxName, targets, b);
      for (const t of targets) {
        const imm = immuneTo(t, S.status);
        if (!imm && Math.random() < (S.chance || 1)) { applyStatus(t, S.status); this.pop(t, STATUS_NAME[S.status], 'status'); }
        else this.pop(t, '无效', 'miss');
      }
      Sound.sfx('debuff');
      await wait(34);
    } else if (S.kind === 'cleanse') {
      await playFx(this, 'heal', targets, b);
      for (const t of targets) { for (const k of ['poison', 'sleep', 'seal', 'stun']) delete t.status[k]; this.pop(t, '清心', 'buff'); }
      await wait(24);
    } else if (S.kind === 'revive') {
      const t = targets[0];
      if (!t.dead) { await this.say('没有效果。'); return; }
      await playFx(this, 'heal', [t], b);
      t.dead = false; t.gone = false; t.hp = Math.round(t.mhp * 0.5); t.ct = 0;
      this.pop(t, t.hp, 'heal'); Sound.sfx('heal');
      await wait(30);
    } else if (S.kind === 'steal') {
      const t = targets[0];
      await this.lunge(b);
      await playFx(this, 'slash', [t], b);
      await this.unlunge(b);
      const E = t.E;
      if (!E.steal || t.stolen) { await this.say('什么也没摸到。'); return; }
      const chance = clamp(0.55 + (eff(b, 'luk') - E.lv) * 0.03, 0.2, 0.95) * (E.boss ? 0.6 : 1);
      if (Math.random() < chance) {
        t.stolen = true; addItem(E.steal, 1); Sound.sfx('coin');
        await this.say(`摸到了 {${ITEMS[E.steal].name}}！`, 60);
      } else await this.say('手慢了一步，没摸到。');
    } else if (S.kind === 'coins') {
      const t = targets[0];
      await playFx(this, 'coins', [t], b);
      const dmg = Math.round((S.power + b.c.lv * 10) * rnd(0.95, 1.05));
      this.damage(t, dmg, {});
      Sound.sfx('coin');
      await wait(30);
      if (t.dead) await this.killAnim(t);
    } else if (S.kind === 'grab') {
      const t = targets[0];
      await this.hitPhys(b, t, S.power, null, 'claw');
      const g = Math.min(State.gold, irnd(8, 20) * (b.E.lv || 1));
      if (g > 0) { State.gold -= g; b.grabbed = (b.grabbed || 0) + g; await this.say(`${b.name} 抢走了 ${g} 文钱！`); }
    } else if (S.kind === 'drain') {
      const t = targets[0];
      const d = await this.hitPhys(b, t, S.power, null, 'claw');
      if (d > 0) { this.heal(b, Math.round(d * 0.5)); await wait(20); }
    }
    b.pose = null;
    this.msg = null; this.msgBig = false;
    if (S.stun) for (const t of targets) if (!t.dead && !t.E?.boss && Math.random() < S.stun) { t.status.stun = 1; this.pop(t, '晕', 'status'); }
    if (S.debuff) for (const t of targets) if (!t.dead) { t.debuff[S.debuff] = 3; }
    await wait(10);
  },
  async useItem(b, id, target) {
    const I = ITEMS[id];
    if (!State.items[id]) return;
    State.items[id]--; if (State.items[id] <= 0) delete State.items[id];
    this.msg = I.name; this.msgT = 999;
    b.pose = 'cast';
    await wait(12);
    let targets = Array.isArray(target) ? target : [target];
    if (I.target === 'enemies') targets = this.enemies.filter((e) => !e.dead);
    if (I.dmg) {
      await playFx(this, I.el === '火' ? 'fire' : 'ice', targets, b);
      for (const t of targets) this.damage(t, Math.round(I.dmg * elemMult(I.el, t.el) * rnd(0.95, 1.05)), { el: elemMult(I.el, t.el) });
      await wait(30);
      for (const t of targets) if (t.dead) await this.killAnim(t);
    } else {
      const t = targets[0];
      if (I.revive) {
        if (!t.dead) { await this.say('没有效果。'); b.pose = null; this.msg = null; return; }
        t.dead = false; t.gone = false; t.hp = Math.round(t.mhp * I.revive); t.ct = 0;
        await playFx(this, 'heal', [t], b); this.pop(t, t.hp, 'heal');
      } else {
        await playFx(this, 'heal', [t], b);
        if (I.heal) this.heal(t, I.heal);
        if (I.full) { this.heal(t, t.mhp); t.mp = t.mmp; }
        if (I.mp) { t.mp = Math.min(t.mmp, t.mp + I.mp); this.pop(t, I.mp, 'mp', I.heal ? 12 : 0); }
        if (I.cure) for (const k of I.cure) delete t.status[k];
        if (I.cure && !I.heal) this.pop(t, '痊愈', 'buff');
      }
      Sound.sfx('heal');
      await wait(30);
    }
    b.pose = null; this.msg = null;
  },
  async tryFlee(b) {
    if (this.cfg.boss || this.cfg.noFlee) { await this.say('无路可逃！'); return; }
    const ps = avg(this.allies.filter((a) => !a.dead).map((a) => effSpd(a)));
    const es = avg(this.enemies.filter((e) => !e.dead).map((e) => effSpd(e)));
    const chance = clamp(0.55 + (ps - es) * 0.04 + (this.fleeTries || 0) * 0.15, 0.25, 0.95);
    this.fleeTries = (this.fleeTries || 0) + 1;
    if (Math.random() < chance) {
      Sound.sfx('escape');
      await this.say('三十六计，走为上计！', 40);
      this.over = true;
      this.finish('flee');
    } else await this.say('没能逃掉！');
  },
  // ---------- damage ----------
  async hitPhys(a, t, power, el, fx, S, noFx) {
    // evade
    const dodge = clamp(0.04 + (effSpd(t) - effSpd(a)) * 0.006 + (eff(t, 'luk') - eff(a, 'luk')) * 0.003, 0.02, 0.18);
    if (!noFx) await playFx(this, fx || 'slash', [t], a);
    if (Math.random() < dodge && !(S && S.sure)) {
      Sound.sfx('miss'); this.pop(t, '闪', 'miss'); t.dodgeT = 12; await wait(24); return 0;
    }
    const A = eff(a, 'atk'), D = eff(t, 'def');
    let dmg = (A * A) / (A + D) * power * rnd(0.9, 1.1);
    const em = elemMult(el, t.el);
    dmg *= em;
    let crit = false;
    if (Math.random() < clamp(0.05 + eff(a, 'luk') * 0.003, 0.05, 0.2)) { dmg *= 1.6; crit = true; }
    if (t.defending) dmg *= 0.5;
    if (t.status.sleep) { delete t.status.sleep; }
    dmg = Math.max(1, Math.round(dmg));
    this.damage(t, dmg, { crit, el: em });
    if (crit) { shake(10, 3); Sound.sfx('crit'); } else Sound.sfx(t.side === 'ally' ? 'hurt' : 'hit');
    await wait(crit ? 26 : 20);
    if (t.dead) await this.killAnim(t);
    return dmg;
  },
  hitMag(a, t, power, el, S) {
    const M = eff(a, 'mag'), R = eff(t, 'mag') * 0.6 + eff(t, 'def') * 0.2;
    let dmg = (M * M) / (M + R) * power * 1.15 * rnd(0.93, 1.07);
    const em = elemMult(el, t.el);
    dmg *= em;
    if (t.defending) dmg *= 0.5;
    if (t.status.sleep) delete t.status.sleep;
    dmg = Math.max(1, Math.round(dmg));
    this.damage(t, dmg, { el: em });
    Sound.sfx(t.side === 'ally' ? 'hurt' : 'hit');
    return dmg;
  },
  damage(t, n, opt) {
    t.hp = Math.max(0, t.hp - n);
    t.hitT = 14; t.flashT = 6;
    this.pop(t, n, opt.crit ? 'crit' : opt.color || (t.side === 'ally' ? 'hurt' : 'dmg'));
    if (opt.el && opt.el > 1) this.pop(t, '克', 'weak', -10);
    else if (opt.el && opt.el < 1) this.pop(t, '抗', 'resist', -10);
    if (t.hp <= 0) { t.dead = true; t.status = {}; t.buff = {}; t.charge = null; }
    if (t.side === 'ally') shake(6, 1);
  },
  heal(t, n) {
    const before = t.hp;
    t.hp = Math.min(t.mhp, t.hp + n);
    this.pop(t, t.hp - before, 'heal');
  },
  async killAnim(t) {
    if (t.gone) return;
    t.gone = true;
    if (t.side === 'enemy') {
      Sound.sfx('die');
      await anim((f) => { t.dissolve = f / 28; return f >= 28; });
    }
  },
  pop(t, val, kind, dy = 0) {
    const p = t.side === 'enemy' ? { x: t.x + t.w / 2, y: t.y + 4 } : { x: t.x + 8 + (t.ox || 0), y: t.y - 2 };
    this.pops.push({ x: p.x, y: p.y + dy, val: String(val), kind, t: 0 });
  },
  async lunge(b) {
    if (b.side === 'ally') { b.pose = 'run'; await anim((f) => { b.ox = -Math.round(f * 2.5); return f >= 8; }); b.pose = 'attack'; }
    else { await anim((f) => { b.ox = Math.round(Math.sin((f / 10) * Math.PI) * 8); return f >= 10; }); b.ox = 0; }
  },
  async unlunge(b) {
    if (b.side === 'ally') { await wait(6); b.pose = 'run'; await anim((f) => { b.ox = -20 + Math.round(f * 2.5); return f >= 8; }); b.ox = 0; b.pose = null; }
  },
  say(text, t = 40) {
    this.msg = text; this.msgBig = false;
    return wait(t).then(() => { if (this.msg === text) this.msg = null; });
  },
  // ---------- end ----------
  async victory() {
    await wait(20);
    Sound.jingle('victory');
    let exp = 0, gold = 0; const drops = [];
    for (const e of this.enemies) {
      exp += e.E.exp; gold += e.E.gold + (e.grabbed || 0);
      for (const [it, ch] of e.E.drops || []) if (Math.random() < ch) drops.push(it);
    }
    State.gold += gold;
    for (const a of this.allies) { a.pose = a.dead ? null : 'win'; }
    const lines = exp || gold ? [`胜利！获得 ${exp} 点经验，${gold} 文钱。`] : [];
    for (const it of drops) { addItem(it, 1); lines.push(`得到了 {${ITEMS[it].name}}。`); }
    for (const a of this.allies) {
      if (a.dead) continue;
      const c = a.c;
      const before = charSkills(c);
      c.exp += exp;
      let up = false;
      while (c.lv < 40 && c.exp >= EXP_TABLE[c.lv + 1]) { c.lv++; up = true; }
      if (up) {
        const s = stats(c);
        lines.push(`${a.name} 升到了 ${c.lv} 级！`);
        const gained = charSkills(c).filter((k) => !before.includes(k));
        for (const k of gained) lines.push(`${a.name} 领悟了「${SKILLS[k].name}」！`);
        a.mhp = s.mhp; a.mmp = s.mmp;
        a.hp = Math.min(s.mhp, a.hp + Math.round(s.mhp * 0.25));
      }
    }
    this.syncBack();
    this.result = { exp, gold };
    for (const ln of lines) await this.resultBox(ln, ln.includes('升到') ? 'lvup' : null);
    this.finish('win');
  },
  resultBox(text, sound) {
    if (sound === 'lvup') Sound.sfx('save');
    return new Promise((res) => { this.menu = new ResultBox(text); this.menu.done = () => { this.menu = null; res(); }; });
  },
  async defeat() {
    await wait(30);
    if (this.cfg.loseOk) { this.syncBack(true); this.finish('lose'); return; }
    Sound.stopMusic();
    await this.say('……', 40);
    this.finish('lose');
  },
  syncBack(restore) {
    for (const a of this.allies) {
      const c = a.c;
      c.hp = a.dead ? (restore ? 1 : 0) : a.hp;
      c.mp = a.mp;
      c.status = {};
      if (a.status.poison) c.status.poison = true;
      if (c.hp <= 0 && !restore) c.hp = 0;
    }
  },
  async finish(result) {
    if (result !== 'win' && result !== 'lose') this.syncBack();
    if (result === 'scripted') this.syncBack();
    await fadeOut('black', 3);
    this.active = false;
    Game.setScene(this.prevScene);
    // KO'd allies stand back up with 1 HP after battle (classic)
    for (const id of State.party) if (State.chars[id].hp <= 0 && result !== 'lose') State.chars[id].hp = 1;
    this.resolve(result);
  },
  // ---------- update/draw ----------
  update() {
    if (this.menu && this.menu.update) this.menu.update();
    for (const b of this.all()) {
      if (b.hitT > 0) b.hitT--;
      if (b.flashT > 0) b.flashT--;
      if (b.dodgeT > 0) b.dodgeT--;
    }
    for (const p of this.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g || 0; p.life--; }
    this.parts = this.parts.filter((p) => p.life > 0);
    for (const p of this.pops) p.t++;
    this.pops = this.pops.filter((p) => p.t < 46);
    for (const f of this.fx) f.t++;
    this.fx = this.fx.filter((f) => f.t < f.life);
    if (this.auto && (Input.pressed.b || Input.pressed.select)) { this.auto = false; Sound.sfx('cancel'); }
  },
  draw(g) {
    rect(g, 0, 0, SW, SH, PAL.K);
    g.drawImage(this.bg, 0, FY);
    // enemies
    for (const e of this.enemies) drawEnemy(g, e, this);
    // party
    for (const a of this.allies) drawAlly(g, a, this);
    // effects
    for (const f of this.fx) f.draw(g, f.t);
    for (const p of this.parts) {
      if (p.img) g.drawImage(p.img, Math.round(p.x), Math.round(p.y));
      else rect(g, Math.round(p.x), Math.round(p.y), p.s || 1, p.s || 1, p.c);
    }
    this.drawTop(g);
    for (const p of this.pops) drawPop(g, p);
    this.drawBottom(g);
    if (this.menu && this.menu.draw) this.menu.draw(g);
  },
  drawTop(g) {
    if (this.msg) {
      drawBox(g, 0, 0, SW, 16, { plain: true });
      const txt = this.msg;
      if (this.msgBig) {
        const w = Font.measure(txt);
        rect(g, Math.round(SW / 2 - w / 2) - 6, 7, 3, 3, PAL.r);
        Font.draw(g, txt, Math.round(SW / 2 - w / 2), 2, INK);
      } else drawRich(g, txt, 5, 2);
      return;
    }
    if (this.desc) { drawBox(g, 0, 0, SW, 16, { plain: true }); drawRich(g, this.desc, 5, 2); return; }
    // turn order strip
    rect(g, 0, 0, SW, FY, PAL.K);
    const order = this.predict(7);
    Font.draw(g, '序', 2, 1, PAL.n);
    order.forEach((b, i) => drawTurnIcon(g, b, 18 + i * 20, 1, i === 0));
    if (this.auto) Font.draw(g, '自动', SW - 26, 1, PAL.y);
  },
  drawBottom(g) {
    drawBox(g, 0, BOT, SW, SH - BOT);
    // party status (right side)
    const x0 = 66;

  const who = await pickMember('谁的招式？');
  if (!who) return;
  const panel = pushPanel((g) => drawDesc(g));
  try {
    for (;;) {
      const c = State.chars[who];
      const list = charSkills(c);
      const entries = list.map((k) => {
        const S = SKILLS[k];
        const fieldUse = ['heal', 'revive', 'cleanse'].includes(S.kind);
        return { label: S.name, right: S.gold ? S.gold + '文' : S.mp, value: k, ok: fieldUse && c.mp >= S.mp && c.hp > 0 };
      });
      const w = new ListWin({ x: 0, y: 0, w: SW, h: SH - 30, rows: 6, entries, title: CHARS[who].name + '  真气 ' + c.mp });
      w.onMove = (e) => { menuDesc = e ? (SKILLS[e.value].el ? `[${SKILLS[e.value].el}]` : '') + SKILLS[e.value].desc : ''; };
      const v = await new Promise((res) => { w.done = res; UI.push(w); });
      if (!v) break;
      const S = SKILLS[v];
      const targets = S.target === 'allies' ? State.party.filter((p) => State.chars[p].hp > 0)
        : [await pickMember('对谁施展？', (pid) => (S.kind === 'revive' ? State.chars[pid].hp <= 0 : State.chars[pid].hp > 0))];
      if (!targets[0]) continue;
      c.mp -= S.mp;
      const mag = stats(c).mag;
      for (const t of targets) {
        const tc = State.chars[t]; const ts = stats(tc);
        if (S.kind === 'heal') tc.hp = Math.min(ts.mhp, tc.hp + Math.round(S.power + mag * S.scale));
        if (S.kind === 'revive') tc.hp = Math.round(ts.mhp * 0.5);
        if (S.kind === 'cleanse') tc.status = {};
      }
      Sound.sfx('heal');
    }
  } finally { UI.remove(panel); menuDesc = ''; }
}

// ---------------- equipment ----------------
const SLOT_NAME = { weapon: '武器', armor: '衣服', acc: '饰品' };
async function equipScreen() {
  const who = await pickMember('给谁换装备？');
  if (!who) return;
  const c = State.chars[who];
  let preview = null;
  const panel = pushPanel((g) => drawEquipStats(g, c, preview));
  try {
    for (;;) {
      const entries = ['weapon', 'armor', 'acc'].map((k) => ({
        label: SLOT_NAME[k], right: c.equip[k] ? (k === 'weapon' && who === 'shenmo' ? SWORD_NAMES[State.sword] : ITEMS[c.equip[k]].name) : '——', value: k, rcol: INK,
        ok: !(k === 'weapon' && CHARS[who].fixedWeapon),
      }));
      const slot = await listWin({ x: 0, y: 0, w: SW, rows: 3, entries, title: CHARS[who].name + ' 的装备' });
      if (!slot) break;
      const opts = Object.keys(State.items).filter((k) => State.items[k] > 0 && ITEMS[k] && ITEMS[k].kind === slot && (!ITEMS[k].who || ITEMS[k].who.includes(who)));
      const entries2 = [{ label: '（卸下）', value: '__none' }].concat(opts.map((k) => ({ label: ITEMS[k].name, right: '×' + State.items[k], value: k })));
      const w = new ListWin({ x: 0, y: 62, w: SW, rows: 3, entries: entries2, title: '换上什么？' });
      w.onMove = (e) => { preview = e ? { slot, item: e.value === '__none' ? null : e.value } : null; };
      const pickV = await new Promise((res) => { w.done = res; UI.push(w); });
      preview = null;
      if (!pickV) continue;
      const old = c.equip[slot];
      const nu = pickV === '__none' ? null : pickV;
      if (old) addItem(old, 1);
      if (nu) consume(nu);
      c.equip[slot] = nu;
      const s = stats(c);
      c.hp = Math.min(c.hp, s.mhp); c.mp = Math.min(c.mp, s.mmp);
      Sound.sfx('chest');
    }
  } finally { UI.remove(panel); }
}
function drawEquipStats(g, c, preview) {
  drawBox(g, 0, 104, SW, 40);
  const now = stats(c);
  let next = null;
  if (preview) {
    const saved = c.equip[preview.slot];
    c.equip[preview.slot] = preview.item;
    next = stats(c);
    c.equip[preview.slot] = saved;
  }
  const keys = [['atk', '攻'], ['def', '防'], ['mag', '灵'], ['spd', '速']];
  keys.forEach(([k, n], i) => {
    const x = 6 + i * 38, y = 108;
    Font.draw(g, n, x, y, PAL.n);
    drawNum(g, now[k], x + 30, y, INK);
    if (next && next[k] !== now[k]) {
      const up = next[k] > now[k];
      Font.draw(g, (up ? '↑' : '↓'), x, y + 14, up ? PAL.G : PAL.r);
      drawNum(g, next[k], x + 30, y + 14, up ? PAL.G : PAL.r);
    }
  });
}

// ---------------- save / load ----------------
const SAVE_KEY = 'duanxue.save.';
function readSlot(n) { try { const s = localStorage.getItem(SAVE_KEY + n); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function writeSlot(n, data) { try { localStorage.setItem(SAVE_KEY + n, JSON.stringify(data)); return true; } catch (e) { return false; } }
function slotLabel(d) {
  if (!d) return '—— 空 ——';
  const t = Math.floor(d.playTime / 60);
  const lv = d.chars && d.chars.shenmo ? d.chars.shenmo.lv : 1;
  return `${d.chapter || ''} Lv${lv} ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
}
async function saveScreen(saving) {
  const entries = [1, 2, 3].map((n) => { const d = readSlot(n); return { label: `${n}  ${slotLabel(d)}`, value: n, ok: saving || !!d }; });
  const n = await listWin({ x: 0, y: 30, w: SW, rows: 3, entries, title: saving ? '存档到哪一栏？' : '读取哪一栏？' });
  if (!n) return null;
  if (saving) {
    const p = Field.player;
    State.x = p.x; State.y = p.y; State.dir = p.dir; State.map = Field.map.def.id;
    const ok = writeSlot(n, State);
    Sound.sfx(ok ? 'save' : 'bump');
    await toast(ok ? '记录完毕。' : '这里写不进存档（浏览器禁止了存储）。');
    return n;
  }
  return readSlot(n);
}
function hasAnySave() { return [1, 2, 3].some((n) => readSlot(n)); }
function loadState(d) {
  State = Object.assign(freshState(), JSON.parse(JSON.stringify(d)));
  Game.setScene(Field);
  Field.player = null;
  Field.load(State.map, State.x, State.y, State.dir);
  Field.resetFollowers();
}

async function shop(stock, greet = '要点什么？') {
  Field.locked++;
  const goldPanel = pushPanel((g) => {
    drawBox(g, 100, 0, 60, 18, { plain: true });
    const s = State.gold + '文';
    Font.draw(g, s, 154 - Font.measure(s), 3, PAL.Y);
  });
  try {
    for (;;) {
      const mode = await listWin({ x: 0, y: 0, w: 60, rows: 3, entries: [{ label: '买', value: 'buy' }, { label: '卖', value: 'sell' }, { label: '走了', value: 'bye' }], title: null });
      if (!mode || mode === 'bye') break;
      const panel = pushPanel((g) => drawDesc(g));
      try {
        for (;;) {
          let entries;
          if (mode === 'buy') entries = stock.map((k) => ({ label: ITEMS[k].name, right: ITEMS[k].price, value: k, ok: State.gold >= ITEMS[k].price, rcol: PAL.Y }));
          else entries = Object.keys(State.items).filter((k) => State.items[k] > 0 && ITEMS[k].kind !== 'key' && ITEMS[k].price > 0)
            .map((k) => ({ label: ITEMS[k].name + ' ×' + State.items[k], right: Math.floor(ITEMS[k].price / 2), value: k, rcol: PAL.Y }));
          const w = new ListWin({ x: 0, y: 20, w: SW, h: SH - 50, rows: 5, entries, title: mode === 'buy' ? '买什么？' : '卖什么？', empty: '没有能卖的。' });
          w.onMove = (e) => { menuDesc = e ? ITEMS[e.value].desc + equipHint(e.value) : ''; };
          const k = await new Promise((res) => { w.done = res; UI.push(w); });
          if (!k) break;
          if (mode === 'buy') { State.gold -= ITEMS[k].price; addItem(k, 1); Sound.sfx('coin'); }
          else { State.gold += Math.floor(ITEMS[k].price / 2); consume(k); Sound.sfx('coin'); }
        }
      } finally { UI.remove(panel); menuDesc = ''; }
    }
  } finally { UI.remove(goldPanel); Field.locked--; }
}
function equipHint(k) {
  const I = ITEMS[k];
  if (!I.bonus) return '';
  const parts = Object.entries(I.bonus).map(([s, v]) => ({ atk: '攻', def: '防', mag: '灵', spd: '速', luk: '运' }[s] + (v > 0 ? '+' : '') + v));
  const who = I.who ? '（' + I.who.map((w) => CHARS[w].name).join('、') + '）' : '';
  return ' [' + parts.join(' ') + ']' + who;
}
async function inn(price, who = '掌柜') {
  const r = await ask(who, `住一晚 ${price} 文，热水热饭都有。歇歇脚吗？`, ['住一晚', '不了'], { cancel: 1 });
  if (r !== 0) return false;
  if (State.gold < price) { await say(who, '这位客官……钱好像不太够啊。'); return false; }
  State.gold -= price;
  await restParty();
  await say(who, '客官早！精神头不错嘛。');
  return true;
}
async function restParty() {
  await fadeOut('black', 6);
  Sound.jingle('rest');
  for (const id of State.party) { const c = State.chars[id]; const s = stats(c); c.hp = s.mhp; c.mp = s.mmp; c.status = {}; }
  await wait(150);
  const mus = Field.map && Field.map.def.music;
  if (mus) Music.play(typeof mus === 'function' ? mus() : mus, true);
  await fadeIn(6);
}

function drawNightSky(g, t, opt = {}) {
  const bands = opt.bands || ['N', 'N', '%', '%', '&', '&', '=', 'U'];
  bands.forEach((c, i) => rect(g, 0, Math.floor((i * 104) / bands.length), SW, Math.ceil(104 / bands.length) + 1, PAL[c]));
  // dithered seams between bands
  for (let i = 1; i < bands.length; i++) {
    const y = Math.floor((i * 104) / bands.length);
    for (let x = 0; x < SW; x += 2) rect(g, x + (i % 2), y - 1, 1, 1, PAL[bands[i]]);
  }
  const R = mulberry(7);
  for (let i = 0; i < 46; i++) {
    const x = Math.floor(R() * SW), y = Math.floor(R() * 70), ph = R() * 6;
    if (Math.sin(t / 30 + ph) > -0.4) rect(g, x, y, 1, 1, Math.sin(t / 20 + ph) > 0.6 ? PAL.W : PAL.i);
  }
}
function drawRidges(g, layers) {
  for (const [base, amp, freq, col, seed, snow] of layers) {
    const r = mulberry(seed);
    const ph = r() * 10, ph2 = r() * 10;
    for (let x = 0; x < SW; x++) {
      const top = Math.round(base - (Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 2.3 + ph2) * amp * 0.45 + amp * 0.3));
      rect(g, x, top, 1, SH - top, PAL[col]);
      if (snow) rect(g, x, top, 1, 1, PAL[snow]);
    }
  }
}

// Paper card with a brush title
async function chapterCard(label, brushKey, sub) {
  State.chapter = label + '·' + (brushKey === '雪夜' ? '雪夜' : brushKey);
  const card = {
    t: 0,
    update() { this.t++; },
    draw(g) {
      rect(g, 0, 0, SW, SH, PAL.p);
      // faint paper fibres
      const R = mulberry(3);
      for (let i = 0; i < 70; i++) rect(g, Math.floor(R() * SW), Math.floor(R() * SH), 2, 1, PAL.z);
      const img = brushImg(brushKey, 'K', null, null);
      const x = Math.round(SW / 2 - img.width / 2), y = 54;
      Font.drawCenter(g, label, 80, 34, PAL.R);
      rect(g, 50, 48, 60, 1, PAL.P);
      g.drawImage(img, x, y);
      rect(g, 50, y + img.height + 6, 60, 1, PAL.P);
      // small seal
      rect(g, x + img.width + 3, y + img.height - 12, 10, 10, PAL.r);
      Font.draw(g, '·', x + img.width + 3, y + img.height - 13, PAL.p);
      if (sub) Font.drawCenter(g, sub, 80, y + img.height + 12, PAL.n);
    },
  };
  const prev = Game.scene;
  Game.setScene(card);
  await fadeIn(6);
  await waitUntil(() => card.t > 150 || (card.t > 30 && Input.ok()));
  await fadeOut('black', 6);
  Game.setScene(prev);
}

// ---------------- game over ----------------
async function gameOver() {
  Sound.jingle('gameover');
  const scene = {
    t: 0, i: 0, done: null,
    update() {
      this.t++;
      if (this.t < 60) return;
      if (Input.rep.up) { this.i = (this.i + 2) % 3; Sound.sfx('cursor'); }
      if (Input.rep.down) { this.i = (this.i + 1) % 3; Sound.sfx('cursor'); }
      if (Input.ok()) { Sound.sfx('ok'); this.done(this.i); }
    },
    draw(g) {
      rect(g, 0, 0, SW, SH, PAL.K);
      const snow = this.snow || (this.snow = new Snow(20));
      snow.update(); snow.draw(g, 0, 0);
      Font.drawCenter(g, '胜败乃兵家常事', 80, 40, PAL.w);
      Font.drawCenter(g, '少侠请重新来过。', 80, 56, PAL.n);
      if (this.t >= 60) {
        ['重新挑战', '读取存档', '回到标题'].forEach((s, k) => Font.draw(g, s, 58, 86 + k * 15, PAL.W));
        drawCursor(g, 48, 88 + this.i * 15);
      }
    },
  };
  FX.tint = null;
  Game.setScene(scene);
  await fadeIn(8);
  return new Promise((res) => { scene.done = res; });
}

// ---------------- battle wrapper with retry ----------------
startBattle = async function (cfg) {
  for (;;) {
    const snap = JSON.parse(JSON.stringify(State));
    const fieldTint = FX.tint;
    const r = await battleOnce(cfg);
    if (r !== 'lose' || cfg.loseOk) return r;
    const choice = await gameOver();
    await fadeOut('black', 4);
    if (choice === 0) { // retry the same battle from the moment before it began
      State = snap;
      healParty();
      Game.setScene(Field);
      FX.tint = fieldTint;
      continue;
    }
    if (choice === 1) {
      Game.setScene(TitleScene);
      const d = await saveScreen(false);
      if (d) { loadState(d); await fadeIn(6); throw ABORT; }
      Game.setScene(TitleScene); TitleScene.enter(); throw ABORT;
    }
    Game.setScene(TitleScene); TitleScene.enter();
    throw ABORT;
  }
};
async function battleOnce(cfg) {
  Sound.sfx('encounter');
  for (let i = 0; i < 3; i++) { FX.invert = 3; await wait(8); }
  await anim((f) => { Game.wipe = f / 20; return f >= 20; });
  const tint = FX.tint;
  FX.tint = null;
  FX.fade = 4; FX.fadeTo = 'black';
  Game.wipe = 0;
  const r = await Battle.start(cfg);
  FX.tint = tint;
  if (r === 'lose' && !cfg.loseOk) return 'lose';
  if (Game.scene === Field && Field.map) {
    Field.draw(ctx);
    const m = Field.map.def.music;
    if (!cfg.keepMusic) Sound.music(typeof m === 'function' ? m() : m);
  }
  if (!cfg.noFadeIn) await fadeIn(3);
  return r;
}

const LOST_SEQ = ['right', 'down', 'left'];
const LOST_MOUTH = { up: [[7, 1], [8, 1], [7, 2]], down: [[7, 12], [8, 12], [8, 11]], left: [[1, 6], [1, 7], [2, 7]], right: [[14, 6], [14, 7], [13, 6]] };
const LOST_ENTRY = { up: [7, 12, 'up'], down: [7, 1, 'down'], left: [14, 7, 'left'], right: [1, 6, 'right'] };
defMap('lost', {
  title: '迷踪竹林',
  music: 'forest',
  weather: 'leaves',
  fill: 'grass',
  legend: BAMBOO_LEGEND,
  bg2: 'bamboo',
  enc: { steps: [16, 28], group: 'bamboo2', bg: 'bamboo' },
  escapeTo: ['bamboo1', 9, 1],
  ground: [
    '#######::#######',
    '#######,,#######',
    '####,,,..,,,####',
    '###,........,###',
    '##,..........,##',
    '##.....S......##',
    ':,............,:',
    ':,............,:',
    '##............##',
    '##,..........,##',
    '###,........,###',
    '####,,,..,,,####',
    '#######,,#######',
    '#######::#######',
  ],
  build(m) {
    const step = State.flags.lostStep || 0;
    const want = LOST_SEQ[step];
    for (const [x, y] of LOST_MOUTH[want]) m.setG(x, y, 'grass4');
    // a different look each time so the clearings feel distinct
    const deco = [[[3, 4], [11, 9]], [[4, 9], [10, 3]], [[3, 8], [11, 4]]][step];
    for (const [x, y] of deco) m.big('bamboo', x, y);
    if (step === 1) m.put(12, 10, 'log');
    if (step === 2) m.put(3, 3, 'shroom_deco');
  },
  events: [
    { type: 'touch', x: 7, y: 0, w: 2, run: () => lostExit('up') },
    { type: 'touch', x: 7, y: 13, w: 2, run: () => lostExit('down') },
    { type: 'touch', x: 0, y: 6, h: 2, run: () => lostExit('left') },
    { type: 'touch', x: 15, y: 6, h: 2, run: () => lostExit('right') },
    { type: 'check', x: 7, y: 5, run: async () => {
      const step = State.flags.lostStep || 0;
      await tell(['石碑：“竹有千枝，路只一条。”', '石碑：“此处已是第二重。”', '石碑：“第三重。回头无岸。”'][step]);
    } },
    Object.assign(shardEvent(2, 13, 9), {}),
  ],
});
async function lostExit(dir) {
  const step = State.flags.lostStep || 0;
  if (dir === 'up' && step === 0) { await Field.warp('bamboo1', 6, 24, 'up'); return; }
  if (dir === LOST_SEQ[step]) {
    if (step === 2) { State.flags.lostStep = 0; setFlag('lostSolved'); await Field.warp('bamboo3', 7, 1, 'down'); return; }
    State.flags.lostStep = step + 1;
    const [x, y, d] = LOST_ENTRY[dir];
    await Field.warp('lost', x, y, d, 'step');
    if (step === 0 && !flag('lostHint')) { setFlag('lostHint'); await say('suli', '……花。刚才的路口，也开着这样的白花。'); }
    return;
  }
  State.flags.lostStep = 0;
  await Field.warp('lost', 7, 1, 'down', 'step');
  await tell('……好像又绕回原地了。');
  if (!flag('lostWarn')) { setFlag('lostWarn'); await say('shenmo', '这林子在耍我们。|石碑上说什么来着——“白花引路”？'); }
}

// light every seal tile you step on; when all are lit, open the sealed door
function sealFloor(id, seals, doors, onOpen) {
  return {
    onLoad(m) {
      for (const [x, y] of seals) if (flag(id + ':' + x + ',' + y)) m.setG(x, y, 'seal_on');
      if (flag(id + ':open')) for (const [x, y] of doors) m.put(x, y, null);
    },
    events: seals.map(([x, y]) => ({ type: 'touch', x, y, cond: () => !flag(id + ':' + x + ',' + y), run: async () => {
      setFlag(id + ':' + x + ',' + y);
      Field.map.setG(x, y, 'seal_on');
      Sound.sfx('buff'); flash('gold', 2);
      const lit = seals.filter(([sx, sy]) => flag(id + ':' + sx + ',' + sy)).length;
      if (lit === seals.length) {
        await wait(20);
        Sound.sfx('earth'); shake(16, 2);
        for (const [dx, dy] of doors) Field.map.put(dx, dy, null);
        setFlag(id + ':open');
        await tell('轰——\n封门上的符纸一张张烧了起来，门开了。');
        if (onOpen) await onOpen();
      } else await toast(`（封印 ${lit}/${seals.length}）`, { life: 50 });
    } })),
  };
}

class Petals {
  constructor(n = 22) { this.f = []; for (let i = 0; i < n; i++) this.f.push({ x: rnd(0, 180), y: rnd(0, 150), v: rnd(0.25, 0.55), ph: rnd(0, 6) }); }
  update() { for (const p of this.f) { p.y += p.v; p.x += Math.sin(p.ph += 0.035) * 0.5 + 0.15; if (p.y > 148) { p.y = -4; p.x = rnd(-20, 170); } } }
  draw(g) { for (const p of this.f) { rect(g, Math.round(p.x), Math.round(p.y), 2, 1, PAL.m); rect(g, Math.round(p.x) + 1, Math.round(p.y) + 1, 1, 1, PAL.M); } }
}

'use strict';
// ============================================================
//  Handheld shell — sizing and touch controls
// ============================================================
(function () {
  const dev = document.getElementById('device');
  const root = document.documentElement;
  const BIG = new URLSearchParams(location.search).has('big');
  if (BIG) {
    document.querySelector('.stage').style.display = 'none';
    const c = document.createElement('canvas');
    c.id = 'screen'; c.width = 160; c.height = 144;
    c.style.cssText = 'image-rendering:pixelated;width:640px;height:576px;display:block;margin:8px';
    document.body.appendChild(c);
    // rebind the global screen canvas
    window.__bigScreen = c;
    return;
  }
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    // device width: limited by viewport width (minus gutter) and height (device is 1.68x tall + hint)
    const hintH = vw < 520 ? 34 : 46;
    let w = Math.min(vw - 32, (vh - hintH - 24) / 1.68, 470);
    w = Math.max(240, w);
    // screen sits inside: device padding 7% each side, bezel padding 5% each side
    const avail = w * (1 - 0.14 - 0.1 * 0.86);
    const scale = Math.max(1, Math.floor((avail * dpr) / 160)) / dpr;
    root.style.setProperty('--dev-w', w + 'px');
    root.style.setProperty('--scr-w', 160 * scale + 'px');
    root.style.setProperty('--scr-h', 144 * scale + 'px');
    root.style.setProperty('--px', scale + 'px');
    root.style.setProperty('--grid', scale * dpr >= 3 && (typeof Settings === 'undefined' || Settings.grid) ? 1 : 0);
  }
  window.applyLayout = layout;
  window.addEventListener('resize', layout);
  layout();

  // --- buttons ---
  const press = (b, on, el) => { Input.touch[b] = on; if (on) Input.latch[b] = true; if (el) el.classList.toggle('down', on); if (on) Audio_.unlock(); };
  document.querySelectorAll('[data-btn]').forEach((el) => {
    const b = el.dataset.btn;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); press(b, true, el); });
    const up = (e) => { e.preventDefault(); press(b, false, el); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });
  // --- d-pad: direction from pointer position, slides between arms ---
  const pad = document.getElementById('dpad');
  let padId = null;
  const setDir = (d) => { for (const k of ['up', 'down', 'left', 'right']) Input.touch[k] = k === d; };
  function padMove(e) {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) { setDir(null); return; }
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMove(e); Audio_.unlock(); });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) padMove(e); });
  const padUp = () => { padId = null; setDir(null); };
  pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp); pad.addEventListener('lostpointercapture', padUp);

  // --- mute toggle ---
  const mute = document.getElementById('mute');
  if (mute) {
    const sync = () => { mute.textContent = Audio_.muted ? '声音：关' : '声音：开'; };
    mute.addEventListener('click', () => { Audio_.unlock(); Audio_.setMuted(!Audio_.muted); sync(); });
    sync();
  }
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  // clicking anywhere gives the page keyboard focus (inside an embedded frame)
  document.addEventListener('pointerdown', () => { try { window.focus(); } catch (e) {} Audio_.unlock(); });
})();

'use strict';
// ============================================================
//  Boot
// ============================================================
function boot() {
  buildCharSprites();
  buildTiles();
  if (typeof buildPortraits === 'function') buildPortraits();
  if (typeof buildBattleArt === 'function') buildBattleArt();
  const q = new URLSearchParams(location.search);
  if (q.get('battle')) {
    // dev: start a battle directly
    State = freshState();
    initParty();
    State.sword = +(q.get('sword') || 1);
    State.flags.ling_fire = true;
    const lv = +(q.get('lv') || 3);
    State.chars.shenmo = newChar('shenmo', lv);
    if (q.get('party')) for (const id of q.get('party').split(',')) { State.chars[id] = newChar(id, lv); State.party.push(id); }
    State.items = { herb: 5, salve: 2, firetalis: 2, incense: 1 };
    State.gold = 200;
    Game.setScene(Field);
    Field.load('town', 13, 9, 'down');
    startLoop();
    setTimeout(() => startBattle({ enemies: q.get('battle').split(','), bg: q.get('bg') || 'snow', boss: q.has('boss') }), 300);
    return;
  }
  if (q.get('jump') && typeof DEV_JUMPS !== 'undefined' && DEV_JUMPS[q.get('jump')]) {
    State = freshState();
    initParty();
    const j = DEV_JUMPS[q.get('jump')];
    for (const f of j.flags || []) State.flags[f] = true;
    State.sword = j.sword || 0;
    for (const k of LING_ORDER.slice(0, State.sword)) State.flags['ling_' + k] = true;
    for (const [id, lv] of j.party) { State.chars[id] = newChar(id, lv); if (!State.party.includes(id)) State.party.push(id); }
    State.items = Object.assign({ herb: 5, salve: 3, lingzhi: 2 }, j.items || {});
    State.gold = j.gold || 300;
    State.chapter = j.chapter || '';
    Game.setScene(Field);
    Field.load(j.map, j.x, j.y, j.dir || 'down');
    Field.resetFollowers();
    startLoop();
    if (j.run) setTimeout(() => runScript(j.run), 200);
    return;
  }
  if (q.get('map')) {
    // dev: jump straight into a map
    State = freshState();
    if (typeof initParty === 'function') initParty();
    Game.setScene(Field);
    Field.load(q.get('map'), +(q.get('x') || 3), +(q.get('y') || 3), 'down');
  } else if (typeof TitleScene !== 'undefined') {
    // keep a running game across live updates of the published page
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      hot.snapshot(() => {
        if (Game.scene !== Field || !Field.map || Field.locked || Battle.active) return {};
        const p = Field.player;
        return { state: Object.assign(JSON.parse(JSON.stringify(State)), { map: Field.map.def.id, x: p.x, y: p.y, dir: p.dir }) };
      });
    }
    const start = (data) => {
      if (data && data.state) { try { loadState(data.state); return; } catch (e) { console.error(e); } }
      Game.setScene(TitleScene);
    };
    if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  } else {
    Game.setScene(Field);
    Field.load('town', 13, 9, 'down');
  }
  startLoop();
}
window.addEventListener('load', boot);
